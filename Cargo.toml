[workspace]
members = ["."]

[package]
name = "tinct"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "tinct"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "tinct"
path = "src/lib.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[features]
default = ["cli", "repl", "lsp"]
cli = ["dep:clap"]
repl = ["dep:rustyline"]
lsp = ["dep:lsp-server", "dep:lsp-types", "dep:url"]

[dependencies]
blake3 = "1"
cap-std = "4"
smallvec = "1"
clap = { version = "4.6", features = ["derive"], optional = true }
indexmap = "2.7"
jiff = { version = "0.1", default-features = false, features = ["std"] }  # Date-time library for timestamp/timezone support
libc = "0.2"  # Used for POSIX signal handling (SIGALRM timeout) in src/main.rs
lsp-server = { version = "0.7", optional = true }
lsp-types = { version = "0.97", optional = true }
url = { version = "2", optional = true }
regex = "1"  # Pattern matching for schema validation
rust_decimal = "1"  # Exact base-10 decimal arithmetic (96-bit software decimal)
num-bigint = "0.4"  # Arbitrary-precision integer arithmetic
subtle = "1"  # Constant-time comparison for cryptographic operations
rustyline = { version = "18.0", optional = true }
rustls = "0.23"  # TLS engine for tls-connect
rustls-native-certs = "0.7"  # System CA roots (default trust store)
webpki-roots = "0.26"  # Mozilla CA roots (opt-in via mozilla-roots: true)
sha2 = "0.10"  # SHA-2 hash algorithms (SHA-256, SHA-384, SHA-512) for SPKI pins
sha3 = "0.10"  # SHA3 hash algorithms for SPKI pins
rustls-pemfile = "2"  # PEM file parsing for CA bundles and client certificates
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }  # HTTP client for http-connect/http-get
serde_json = "1.0"
strsim = "0.11"

[dev-dependencies]
walkdir = "2"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"  # Kernel-level filesystem ACL enforcement (Linux 5.13+)
seccompiler = "0.5"  # seccomp-bpf network and process sandbox

[workspace]
members = ["."]

[package]
name = "tinct"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "tinct"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "tinct"
path = "src/lib.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[features]
default = ["cli", "repl", "lsp"]
cli = ["dep:clap"]
repl = ["dep:rustyline"]
lsp = ["dep:lsp-server", "dep:lsp-types"]

[dependencies]
blake3 = "1"
cap-std = "3"
smallvec = "1"
clap = { version = "4.6", features = ["derive"], optional = true }
indexmap = "2.7"
libc = "0.2"  # Used for POSIX signal handling (SIGALRM timeout) in src/main.rs
lsp-server = { version = "0.7", optional = true }
lsp-types = { version = "0.95", optional = true }
rustyline = { version = "14.0", optional = true }
serde_json = "1.0"
strsim = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"  # Kernel-level filesystem ACL enforcement (Linux 5.13+)

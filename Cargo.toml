[package]
name = "tinct"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "tinct"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "tinct"
path = "src/lib.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[features]
default = ["cli", "repl", "lsp"]
cli = ["dep:clap"]
repl = ["dep:rustyline"]
lsp = ["dep:lsp-server", "dep:lsp-types"]

[dependencies]
clap = { version = "4.6", features = ["derive"], optional = true }
indexmap = "2.7"
libc = "0.2"  # Used for POSIX signal handling (SIGALRM timeout) in src/main.rs
lsp-server = { version = "0.7", optional = true }
lsp-types = { version = "0.95", optional = true }
pest = "2.8"
pest_derive = "2.8"
rustyline = { version = "14.0", optional = true }
serde_json = "1.0"

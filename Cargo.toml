[workspace]
members = [".", "tinct-derive"]

[package]
name = "tinct"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "tinct"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "tinct"
path = "src/lib.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
tinct-derive = { path = "tinct-derive" }
blake3 = "1"
cap-std = "4"
smallvec = "1"
clap = { version = "4.6", features = ["derive"], optional = true }
indexmap = "2.7"
jiff = { version = "0.2", default-features = false, features = ["std"] }  # Date-time library for timestamp/timezone support
libc = "0.2"  # Used for POSIX signal handling (SIGALRM timeout) in src/main.rs
url = "2"  # URL parsing for network builtins
regex = "1"  # Pattern matching for schema validation
rust_decimal = "1"  # Exact base-10 decimal arithmetic (96-bit software decimal)
num-bigint = "0.4"  # Arbitrary-precision integer arithmetic
subtle = "2"  # Constant-time comparison for cryptographic operations
ipnet = "2"  # CIDR notation parsing for --cap-net ranges
hex = "0.4"  # Hex encoding for SPKI hashes in tls-peer-cert
rustls = { version = "0.23", features = ["ring"] }  # TLS engine for tls-connect
rustls-native-certs = "0.8"  # System CA roots (default trust store)
webpki-roots = "1"  # Mozilla CA roots (opt-in via mozilla-roots: true)
sha2 = "0.11"  # SHA-2 hash algorithms (SHA-256, SHA-384, SHA-512) for SPKI pins
sha3 = "0.11"  # SHA3 hash algorithms for SPKI pins
rustls-pemfile = "2"  # PEM file parsing for CA bundles and client certificates
x509-parser = "0.18.1"  # X.509 certificate parsing for tls-peer-cert and SPKI extraction
reqwest = { version = "0.13", features = ["blocking", "rustls", "http2"], default-features = false }  # HTTP client for http-connect/http-get
tokio = { version = "1", features = ["full"] }  # Async runtime for QUIC/HTTP3 builtins (via async_rt::block_on)
tokio-util = "0.7"  # Async utilities (CancellationToken, etc.)
quinn = { version = "0.11", default-features = false, features = ["rustls", "ring"] }  # QUIC transport for http3-session
h3 = "0.0.8"  # HTTP/3 over QUIC (hyperium)
h3-quinn = "0.0.10"  # Quinn QUIC adapter for h3 (0.0.10+ compatible with quinn 0.11)
bytes = "1"  # Byte buffer abstraction (shared dep with quinn/h3; used in Http3Session body type)
http = "1"  # HTTP types (Request, Response, HeaderMap) used in http-request builtin via h3
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1" }
strsim = "0.11"

[lints.clippy]
arc_with_non_send_sync = "deny"

[dev-dependencies]
walkdir = "2"
criterion = "0.5"

[[bench]]
name = "eval"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"  # Kernel-level filesystem ACL enforcement (Linux 5.13+)
seccompiler = "0.5"  # seccomp-bpf network and process sandbox
xattr = "1"  # Extended attributes API for Linux

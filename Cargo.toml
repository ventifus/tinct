[package]
name = "lazy_lisp_transformer"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "llt"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "lazy_lisp_transformer"
path = "src/lib.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[features]
default = ["cli", "repl"]
cli = ["dep:clap"]
repl = ["dep:rustyline", "cli"]

[dependencies]
clap = { version = "4.6", features = ["derive"], optional = true }
indexmap = "2.7"
pest = "2.8"
pest_derive = "2.8"
rustyline = { version = "14.0", optional = true }
serde_json = "1.0"
